[package]
name = "booth"
version.workspace = true
description = "Booth by NoFaceTube: local text to speech and voice cloning on ZONOS3-Mini"
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows-only clash,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "booth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
booth-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "2"

# Phones update through the store or a new APK, not Tauri's updater.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
# The engine's LACI heads, built into the app and unpacked on start (scripts/build-android-engine.sh
# puts them in android-engine/).
include_dir = "0.7"
# Starting RenderService (the "Generating speech" notification) from Rust. The same versions tao uses.
jni = "0.21"
ndk-context = "0.1"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = [ "custom-protocol" ]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = [ "tauri/custom-protocol" ]
