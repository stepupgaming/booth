[package]
name = "booth-core"
description = "Booth's engine manager, model downloader, ZONOS3 API client, voices and takes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
hound = "3.5"
ebur128 = "0.1"
rusty_mp3 = "1"
# M4A (AAC), Ogg Opus and FLAC export, all pure Rust. oxideav-aac is vendored with speed fixes.
oxideav-aac = { path = "../../third_party/oxideav-aac" }
opus-pure = "0.2.3"
flacenc = { version = "0.5.1", default-features = false }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
schemars = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
encoding_rs = "0.8"

[dev-dependencies]
# Decodes M4A and FLAC in the export tests.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "flac"] }

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"
